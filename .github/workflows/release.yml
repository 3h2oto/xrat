name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to finish publishing to crates.io
        required: true
        type: string
      assets_run_id:
        description: Original release run containing the matching web-assets artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  validate:
    if: github.event_name == 'push'
    name: CI
    uses: ./.github/workflows/ci.yml

  version-check:
    name: Version check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(awk '/^\[workspace.package\]/{f=1} f&&/^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match workspace version $CARGO_VERSION"
            exit 1
          fi

  web-assets:
    name: Build browser assets
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just web-tools web-build
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: crates/xrat-app/web-assets/

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [version-check, web-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: crates/xrat-app/web-assets/

      - name: Install musl-tools
        if: ${{ !matrix.cross && runner.os == 'Linux' }}
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          mkdir -p stage
          cp "target/${TARGET}/release/xrat" stage/xrat
          cp LICENSE README.md stage/
          ARCHIVE="xrat-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" -C stage .

      - uses: actions/upload-artifact@v7
        with:
          name: xrat-${{ matrix.target }}
          path: xrat-*.tar.gz
          if-no-files-found: error

  windows-build:
    name: Windows
    needs: [version-check, web-assets]
    uses: ./.github/workflows/windows.yml
    with:
      web_assets_artifact: web-assets

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux archives
        uses: actions/download-artifact@v8
        with:
          pattern: xrat-*-unknown-linux-musl
          merge-multiple: true
          path: ${{ runner.temp }}/xrat-release-archives

      - name: Prepare image binaries
        run: |
          mkdir -p image-bin/amd64 image-bin/arm64
          tar -xzf "$RUNNER_TEMP/xrat-release-archives/xrat-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C image-bin/amd64 ./xrat
          tar -xzf "$RUNNER_TEMP/xrat-release-archives/xrat-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl.tar.gz" -C image-bin/arm64 ./xrat
          test -x image-bin/amd64/xrat
          test -x image-bin/arm64/xrat
          file image-bin/amd64/xrat | grep -q 'x86-64'
          file image-bin/arm64/xrat | grep -q 'ARM aarch64'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, windows-build]
    steps:
      - uses: actions/checkout@v5

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: xrat-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum xrat-*.tar.gz xrat-*.zip > SHASUMS256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/RELEASE_NOTE.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            gh release create "${{ github.ref_name }}" \
              dist/xrat-*.tar.gz dist/xrat-*.zip \
              dist/SHASUMS256.txt \
              --title "${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE"
          else
            echo "No $NOTES_FILE found; generating notes from commits"
            gh release create "${{ github.ref_name }}" \
              dist/xrat-*.tar.gz dist/xrat-*.zip \
              dist/SHASUMS256.txt \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify release source and asset provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ASSETS_RUN_ID: ${{ inputs.assets_run_id || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
          [[ "$ASSETS_RUN_ID" =~ ^[0-9]+$ ]]
          VERSION=$(awk '/^\[workspace.package\]/{f=1} f&&/^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          test "$RELEASE_TAG" = "v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ASSETS_RUN_ID" > "$RUNNER_TEMP/release-source-run.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-source-run.json').read_text())
          assert run['head_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert run['head_branch'] == os.environ['RELEASE_TAG']
          assert run['event'] == 'push'
          assert run['path'].split('@', 1)[0] == '.github/workflows/release.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: crates/xrat-app/web-assets/
          run-id: ${{ inputs.assets_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish workspace crates in dependency order
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[workspace.package\]/{f=1} f&&/^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          echo "workspace version: ${VERSION}"
          publish() {
            local crate="$1"
            local args=()
            if [ "$crate" = xrat-app ]; then
              test -z "$(git status --porcelain)"
              args+=(--allow-dirty)
            fi
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "${crate}" --locked "${args[@]}"; then
                return 0
              fi
              echo "publish ${crate} attempt ${attempt} failed; retrying after index refresh"
              sleep 20
            done
            return 1
          }
          # Dependency order: leaves first. Skip versions already on crates.io so
          # re-running a partially completed release is safe.
          for crate in \
            xrat-model \
            xrat-support \
            xrat-config \
            xrat-engines \
            xrat-db \
            xrat-prober \
            xrat-web \
            xrat-app \
            xrat-sdk \
            xrat ; do
            if curl -sf -A "xrat-release" "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null; then
              echo "skip ${crate} ${VERSION} (already published)"
              continue
            fi
            echo "publishing ${crate} ${VERSION}"
            publish "${crate}"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Verify registry-only SDK consumer
        run: |
          VERSION=$(awk '/^\[workspace.package\]/{f=1} f&&/^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          XRAT_SDK_REGISTRY_VERSION="$VERSION" cargo test --locked -p xrat --test sdk_boundary standalone_consumer -- --ignored --exact --nocapture
