name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just web-tools web-build web-check
      - run: just version-check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -q --locked --workspace
      - name: Verify SDK public features and standalone consumer
        run: just sdk-check

  macos-check:
    name: Check macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-check-${{ matrix.target }}
      - run: cargo check --locked --workspace --target ${{ matrix.target }}
      - name: Native macOS split resolution and lifecycle guards
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo test --locked -p xrat-app split_tunnel
          cargo test --locked -p xrat-app tun_validation
          cargo test --locked -p xrat-app tun_control::tests
          cargo test --locked -p xrat-support net::
      - name: Native privileged utun release contract
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-darwin-arm64.tar.gz -o "$RUNNER_TEMP/sing-box-macos.tar.gz"
          echo "62bca85bf08b9145288729cf010c98ea9877b8086f7369cde9e127012d509424  $RUNNER_TEMP/sing-box-macos.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/sing-box-macos.tar.gz" -C "$RUNNER_TEMP"
          cargo test --locked -p xrat-support --lib --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "xrat_support" and .executable != null) | .executable' > "$RUNNER_TEMP/macos-support-test"
          sudo env XRAT_MACOS_SINGBOX="$RUNNER_TEMP/sing-box-1.13.21-darwin-arm64/sing-box" "$(cat "$RUNNER_TEMP/macos-support-test")" --ignored --exact net::macos_links::tests::native_utun_release_preserves_dns_after_graceful_and_forced_exit --nocapture

  sdk-native:
    name: SDK native engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned validators
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-engines/xray"
          curl -fL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o "$RUNNER_TEMP/sdk-engines/xray.zip"
          unzip -q "$RUNNER_TEMP/sdk-engines/xray.zip" -d "$RUNNER_TEMP/sdk-engines/xray"
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-linux-amd64.tar.gz -o "$RUNNER_TEMP/sdk-engines/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdk-engines/sing-box.tar.gz" -C "$RUNNER_TEMP/sdk-engines"
          echo "XRAT_SDK_XRAY_BINARY=$RUNNER_TEMP/sdk-engines/xray/xray" >> "$GITHUB_ENV"
          echo "XRAT_SDK_SINGBOX_BINARY=$RUNNER_TEMP/sdk-engines/sing-box-1.13.21-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Validate SDK JSON and probe cleanup
        run: cargo test --locked -p xrat-sdk --test native -- --ignored

  runtime-network:
    name: Managed runtime network acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install checksum-pinned runtime engines
        run: just runtime-engines "$RUNNER_TEMP/runtime-engines"
      - name: Validate generated DNS configurations
        env:
          XRAT_RUNTIME_XRAY: ${{ runner.temp }}/runtime-engines/xray
          XRAT_RUNTIME_SINGBOX: ${{ runner.temp }}/runtime-engines/sing-box
          XRAT_RUNTIME_FIXTURE_DIR: ${{ runner.temp }}/runtime-native
        run: cargo test --locked -p xrat-app dns_runtime_native_fixtures -- --ignored
      - name: Validate sing-box conformance matrix
        run: just singbox-conformance "$RUNNER_TEMP/runtime-engines/sing-box" "$RUNNER_TEMP/singbox-conformance"
      - name: Build managed runtime CLI and integration tests
        run: |
          set -euo pipefail
          cargo build --locked -p xrat
          cargo test --locked -p xrat --test runtime_network --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "runtime_network" and .executable != null) | "XRAT_RUNTIME_TEST_BINARY=" + .executable' >> "$GITHUB_ENV"
      - name: Exercise isolated DNS traffic
        run: sudo env XRAT_RUNTIME_XRAY="$RUNNER_TEMP/runtime-engines/xray" XRAT_RUNTIME_SINGBOX="$RUNNER_TEMP/runtime-engines/sing-box" XRAT_RUNTIME_FIXTURE_DIR="$RUNNER_TEMP/runtime-native" "$XRAT_RUNTIME_TEST_BINARY" --ignored --exact dns_network --nocapture
      - name: Exercise isolated managed TUN capture and cleanup
        run: sudo env XRAT_RUNTIME_CLI="$PWD/target/debug/xrat" XRAT_RUNTIME_XRAY="$RUNNER_TEMP/runtime-engines/xray" XRAT_RUNTIME_SINGBOX="$RUNNER_TEMP/runtime-engines/sing-box" XRAT_RUNTIME_OUTPUT="$RUNNER_TEMP/runtime-tun" "$XRAT_RUNTIME_TEST_BINARY" --ignored --exact tun_network --nocapture
      - name: Exercise newer Xray managed capture and cleanup
        run: sudo env XRAT_RUNTIME_CLI="$PWD/target/debug/xrat" XRAT_RUNTIME_XRAY="$RUNNER_TEMP/runtime-engines/xray-new" XRAT_RUNTIME_SINGBOX="$RUNNER_TEMP/runtime-engines/sing-box" XRAT_RUNTIME_OUTPUT="$RUNNER_TEMP/runtime-tun-new" "$XRAT_RUNTIME_TEST_BINARY" --ignored --exact tun_network --nocapture
      - name: Restore receipt ownership for artifact upload
        if: always()
        run: |
          for directory in "$RUNNER_TEMP/runtime-native" "$RUNNER_TEMP/runtime-tun" "$RUNNER_TEMP/runtime-tun-new"; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - name: Upload native and network receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-network-receipts
          path: |
            ${{ runner.temp }}/runtime-native
            ${{ runner.temp }}/singbox-conformance
            ${{ runner.temp }}/runtime-tun
            ${{ runner.temp }}/runtime-tun-new
            ${{ runner.temp }}/runtime-engines/engine-receipts.json
            !${{ runner.temp }}/runtime-native/resolver.key
