[package]
name = "xrat-prober"
version = "0.20.0"
edition = "2024"
license = "MIT"
description = "TCP, ICMP, download, upload, and real-delay probing for xrat"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
    "socks",
] }
tokio = { version = "1.52.3", features = ["full"] }
xrat-engines = { path = "../xrat-engines" }
xrat-model = { path = "../xrat-model" }

[dev-dependencies]
axum = "0.8.9"
xrat = { path = "../.." }
