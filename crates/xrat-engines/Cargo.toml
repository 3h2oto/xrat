[package]
name = "xrat-engines"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Xray and sing-box config parsing and runtime config generation"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
prost = "0.13"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
tonic = { version = "0.12", default-features = false, features = [
    "transport",
    "codegen",
    "prost",
] }
uuid = { version = "1.23.2", features = ["v4"] }
xrat-config.workspace = true
xrat-model.workspace = true
xrat-support.workspace = true
