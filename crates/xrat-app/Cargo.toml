[package]
name = "xrat-app"
version = "0.20.0"
edition = "2024"
license = "MIT"
description = "Application, CLI, TUI, and HTTP layers for xrat"

[dependencies]
xrat-config = { path = "../xrat-config" }
xrat-db = { path = "../xrat-db" }
xrat-engines = { path = "../xrat-engines" }
xrat-model = { path = "../xrat-model" }
xrat-prober = { path = "../xrat-prober" }
xrat-support = { path = "../xrat-support" }
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3.0"
crossterm = "0.29.0"
indicatif = "0.18.4"
flate2 = "1.1.5"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
    "socks",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha2 = "0.10.9"
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = [
    "transport",
    "codegen",
    "prost",
] }
percent-encoding = "2.3.2"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
] }
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
serde_path_to_error = "0.1.20"
sysinfo = "0.37.2"
uuid = { version = "1.23.2", features = ["v4"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tar = "0.4.44"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
maxminddb = "0.28.1"
qrcode = { version = "0.14.1", default-features = false }
arboard = "3.6.1"
unicode-width = "0.2.2"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
if-addrs = "0.15.0"
