<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#261c15" />
    <title>Offline · XRAT</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #261c15;
        color: #f5e8d2;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #c2a98c;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        background: #e9ad55;
        color: #24170e;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cannot reach XRAT</h1>
      <p>
        Check your connection and make sure your XRAT server is running, then
        try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
