[package]
name = "xrat-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared WebUI API contracts and Dioxus frontend for XRAT"


[features]
default = []
ui = ["dep:dioxus", "dep:serde_json", "dep:serde_urlencoded", "dep:gloo-net", "dep:gloo-timers", "dep:web-sys", "dep:wasm-bindgen", "dep:icons", "dep:strum", "dep:tw_merge", "dep:js-sys"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch", "document"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlElement", "Document", "EventSource", "MessageEvent", "CustomEvent", "Event", "History", "Location", "EventTarget"], optional = true }
wasm-bindgen = { version = "=0.2.122", optional = true }
icons = { version = "=0.19.0", default-features = false, features = ["dioxus"], optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
tw_merge = { version = "=0.1.22", optional = true }
js-sys = { version = "0.3", optional = true }
